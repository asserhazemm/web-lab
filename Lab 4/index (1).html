<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Todo App</h1>

    <div class="add-row">
      <input id="new-todo" type="text" placeholder="What needs doing?">
      <button id="add">Add</button>
    </div>

    <div class="toolbar">
      <span class="tip">Tip: double-click a todo to edit. Press Enter to save.</span>
      <div>
        <button id="filter-all" class="filter">All</button>
        <button id="filter-active" class="filter">Active</button>
        <button id="filter-completed" class="filter">Completed</button>
      </div>
    </div>

    <ul id="list"></ul>

    <div class="footer">
      <span id="count">0 items left</span>
      <div>
        <button id="clear-completed" class="small">Clear completed</button>
        <button id="clear-all" class="small">Clear all</button>
      </div>
    </div>
  </div>

  <!-- The browser runs the JavaScript that tsc generated from script.ts -->
  <script src="script.js"></script>
</body>
</html>
